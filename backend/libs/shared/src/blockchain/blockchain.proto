syntax = "proto3";

package blockchain;

// Contract surface for the blockchain/ZKP microservice. Consumed by
// api-gateway (proxying browser requests) and by polls (server-to-server,
// e.g. to resolve group state without round-tripping through the gateway).
//
// GetMerkleProof/JoinGroup/VerifyVoteProof/SubmitVote are all implemented.
// VerifyVoteProof/SubmitVote's request shape matches @semaphore-protocol/proof's
// SemaphoreProof type field-for-field.
service BlockchainService {
  // Registers an identity commitment as a member of a poll's Semaphore
  // group (off-chain group state, mirrored on-chain by the contract layer).
  // Gated to one commitment per (pollId, userId): resubmitting the same
  // commitment is idempotent, but a second, different commitment for a poll
  // the user already joined is rejected (ALREADY_EXISTS).
  rpc JoinGroup (JoinGroupRequest) returns (JoinGroupResponse);

  // Returns the Merkle proof (path + siblings) the client needs to build a
  // Semaphore proof for this poll's group, given the voter's identity
  // commitment. Assumes the commitment was already added via JoinGroup.
  rpc GetMerkleProof (MerkleProofRequest) returns (MerkleProofResponse);

  // Verifies a submitted Semaphore proof off-chain, with no on-chain side
  // effect — lets the caller give instant feedback before spending relayer
  // gas on SubmitVote.
  rpc VerifyVoteProof (VerifyVoteProofRequest) returns (VerifyVoteProofResponse);

  // Verifies the same proof and, if valid, relays it on-chain to the poll's
  // contract from the service's own relayer account (never the voter's
  // wallet — anonymity depends on every vote sharing one sender). The actual
  // vote tally only updates once the chain listener observes the resulting
  // VoteCast log and republishes it as vote.cast.
  rpc SubmitVote (VerifyVoteProofRequest) returns (SubmitVoteResponse);
}

message JoinGroupRequest {
  string pollId = 1;
  string identityCommitment = 2;
  // Forwarded by the gateway from the caller's JWT — gates group admission
  // to one commitment per (pollId, userId). Never used beyond that check.
  string userId = 3;
}

message JoinGroupResponse {
  string root = 1;
  int32 index = 2;
}

message MerkleProofRequest {
  string pollId = 1;
  string identityCommitment = 2;
}

message MerkleProofResponse {
  string root = 1;
  int32 index = 2;
  repeated string siblings = 3;
}

message VerifyVoteProofRequest {
  string pollId = 1;
  int32 merkleTreeDepth = 2;
  string merkleTreeRoot = 3;
  string nullifier = 4;
  // The chosen option, as a Semaphore field element (see uuidToFieldElement) —
  // this *is* the vote; there's no separate optionId to cross-check it against.
  string message = 5;
  string scope = 6;
  repeated string points = 7;
}

message VerifyVoteProofResponse {
  bool valid = 1;
}

message SubmitVoteResponse {
  string transactionHash = 1;
}
