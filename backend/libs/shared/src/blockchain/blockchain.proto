syntax = "proto3";

package blockchain;

// Contract surface for the blockchain/ZKP microservice. Consumed by
// api-gateway (proxying browser requests) and by polls (server-to-server,
// e.g. to resolve group state without round-tripping through the gateway).
//
// GetMerkleProof/JoinGroup are implemented (Semaphore group management).
// VerifyVoteProof's message shape matches @semaphore-protocol/proof's
// SemaphoreProof type field-for-field; its implementation lands with the
// on-chain client in step 3.
service BlockchainService {
  // Registers an identity commitment as a member of a poll's Semaphore
  // group (off-chain group state, mirrored on-chain by the contract layer).
  // Idempotent: rejoining with the same commitment returns its existing root/index.
  rpc JoinGroup (JoinGroupRequest) returns (JoinGroupResponse);

  // Returns the Merkle proof (path + siblings) the client needs to build a
  // Semaphore proof for this poll's group, given the voter's identity
  // commitment. Assumes the commitment was already added via JoinGroup.
  rpc GetMerkleProof (MerkleProofRequest) returns (MerkleProofResponse);

  // Verifies a submitted Semaphore proof off-chain before it's relayed
  // on-chain, so invalid submissions fail fast without spending gas.
  rpc VerifyVoteProof (VerifyVoteProofRequest) returns (VerifyVoteProofResponse);
}

message JoinGroupRequest {
  string pollId = 1;
  string identityCommitment = 2;
}

message JoinGroupResponse {
  string root = 1;
  int32 index = 2;
}

message MerkleProofRequest {
  string pollId = 1;
  string identityCommitment = 2;
}

message MerkleProofResponse {
  string root = 1;
  int32 index = 2;
  repeated string siblings = 3;
}

message VerifyVoteProofRequest {
  string pollId = 1;
  string optionId = 2;
  int32 merkleTreeDepth = 3;
  string merkleTreeRoot = 4;
  string nullifier = 5;
  string message = 6;
  string scope = 7;
  repeated string points = 8;
}

message VerifyVoteProofResponse {
  bool valid = 1;
}
