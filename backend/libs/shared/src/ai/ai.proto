syntax = "proto3";

package ai;

service AiService {
  rpc CheckDuplicatePoll (CheckDuplicatePollRequest) returns (CheckDuplicatePollResponse);
  rpc SearchPolls (SearchPollsRequest) returns (SearchPollsResponse);
  rpc CheckPollNeutrality (CheckPollNeutralityRequest) returns (CheckPollNeutralityResponse);
  rpc Chat (ChatRequest) returns (stream ChatChunk);
}

message CheckDuplicatePollRequest {
  string title = 1;
  string description = 2;
}

message DuplicateMatch {
  string pollId = 1;
  string title = 2;
  float similarity = 3;
}

message CheckDuplicatePollResponse {
  repeated DuplicateMatch matches = 1;
}

message SearchPollsRequest {
  string query = 1;
}

message PollSearchResult {
  string pollId = 1;
  float similarity = 2;
}

message SearchPollsResponse {
  repeated PollSearchResult results = 1;
}

message CheckPollNeutralityRequest {
  string title = 1;
  repeated string options = 2;
}

message NeutralityIssue {
  string text = 1;
  string explanation = 2;
  string suggestion = 3;
}

message CheckPollNeutralityResponse {
  bool isNeutral = 1;
  repeated NeutralityIssue issues = 2;
}

message ChatTurn {
  string role = 1; // "user" or "model"
  string content = 2;
}

message ChatRequest {
  string message = 1;
  repeated ChatTurn history = 2;
}

message ChatChunk {
  string textDelta = 1;
}
