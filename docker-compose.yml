# Step 2: the 4 local Postgres databases, matching the names/credentials
# already configured in each service's own .env. App services are added in
# later steps of the containerization plan.
#
# Note: inside the Docker network every Postgres container listens on its
# own internal 5432 — e.g. `postgres-identity:5432`, not `:5433`/`:5434`/
# `:5435`. The host-side ports below (5432-5435) only exist so you can still
# connect from tools on your machine (psql, a GUI client, a natively-run
# service), exactly as today.
#
# Credentials come from a root-level .env (gitignored, auto-loaded by
# Docker Compose for ${VAR} substitution) rather than being written here in
# plaintext.

networks:
  voting-system:
    driver: bridge

volumes:
  postgres-identity-data:
  postgres-polls-data:
  postgres-blockchain-data:
  postgres-ai-data:
  notifications-node-modules:
  identity-node-modules:
  identity-prisma-generated:
  polls-node-modules:
  polls-prisma-generated:
  blockchain-node-modules:
  blockchain-prisma-generated:
  api-gateway-node-modules:
  ai-service-venv:
  frontend-node-modules:
  frontend-next-cache:

services:
  postgres-identity:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
      POSTGRES_DB: identity_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER} -d identity_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voting-system

  postgres-polls:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POLLS_DB_USER}
      POSTGRES_PASSWORD: ${POLLS_DB_PASSWORD}
      POSTGRES_DB: polls_service_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-polls-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POLLS_DB_USER} -d polls_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voting-system

  postgres-blockchain:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BLOCKCHAIN_DB_USER}
      POSTGRES_PASSWORD: ${BLOCKCHAIN_DB_PASSWORD}
      POSTGRES_DB: blockchain
    ports:
      - "5434:5432"
    volumes:
      - postgres-blockchain-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLOCKCHAIN_DB_USER} -d blockchain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voting-system

  postgres-ai:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AI_DB_USER}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
      POSTGRES_DB: ai_service_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER} -d ai_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voting-system

  # Step 3: notifications — simplest Node service (no DB, no inbound
  # transport, just a RabbitMQ consumer against the existing CloudAMQP
  # broker) — used to validate the base Node/Nest Dockerfile pattern.
  notifications:
    build:
      context: ./backend
      dockerfile: apps/notifications/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/apps/notifications/.env
    volumes:
      - ./backend:/app
      - notifications-node-modules:/app/node_modules
    networks:
      - voting-system

  # Step 4: identity — adds the Prisma generate/migrate-on-boot pattern
  # (see docker-entrypoint.sh) and the first local-Postgres dependency.
  identity:
    build:
      context: ./backend
      dockerfile: apps/identity/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/apps/identity/.env
    environment:
      # Only the DB host changes for the container network — everything
      # else (secrets, R2, RabbitMQ) comes from the real .env above.
      DATABASE_URL: postgresql://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD_URLENC}@postgres-identity:5432/identity_service_db
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - identity-node-modules:/app/node_modules
      - identity-prisma-generated:/app/apps/identity/src/generated
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - voting-system

  # Step 5: polls — same pattern as identity, gRPC transport, plus the
  # external Upstash Redis URL passed through unchanged. No migrations/
  # directory exists for this app (schema-managed via `db push`, see its
  # docker-entrypoint.sh).
  polls:
    build:
      context: ./backend
      dockerfile: apps/polls/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/apps/polls/.env
    environment:
      POLLS_SERVICE_DATABASE_URL: postgresql://${POLLS_DB_USER}:${POLLS_DB_PASSWORD_URLENC}@postgres-polls:5432/polls_service_db
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - polls-node-modules:/app/node_modules
      - polls-prisma-generated:/app/apps/polls/src/generated
    depends_on:
      postgres-polls:
        condition: service_healthy
    networks:
      - voting-system

  # Step 5: blockchain — same pattern, gRPC transport. RPC_URL/relayer key/
  # contract address are all external Sepolia config, passed through
  # unchanged from the real .env.
  blockchain:
    build:
      context: ./backend
      dockerfile: apps/blockchain/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/apps/blockchain/.env
    environment:
      BLOCKCHAIN_SERVICE_DATABASE_URL: postgresql://${BLOCKCHAIN_DB_USER}:${BLOCKCHAIN_DB_PASSWORD}@postgres-blockchain:5432/blockchain?schema=public
    ports:
      - "3003:3003"
    volumes:
      - ./backend:/app
      - blockchain-node-modules:/app/node_modules
      - blockchain-prisma-generated:/app/apps/blockchain/src/generated
    depends_on:
      postgres-blockchain:
        condition: service_healthy
    networks:
      - voting-system

  # Step 6: api-gateway — ties identity/polls/blockchain/ai-service
  # together. Their client URLs were hardcoded to 127.0.0.1 in source
  # (auth.module.ts, polls.module.ts, blockchain.module.ts, ai.module.ts);
  # those were parameterized to read an optional *_SERVICE_HOST env var,
  # defaulting to 127.0.0.1 so native runs are unaffected. Only the host
  # needs overriding here — ports are unchanged between native and Docker.
  # No local Postgres of its own, so no DB var to override.
  api-gateway:
    build:
      context: ./backend
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      IDENTITY_SERVICE_HOST: identity
      POLLS_SERVICE_HOST: polls
      BLOCKCHAIN_SERVICE_HOST: blockchain
      AI_SERVICE_HOST: ai-service
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - api-gateway-node-modules:/app/node_modules
    depends_on:
      - identity
      - polls
      - blockchain
    networks:
      - voting-system

  # Step 7: ai-service — Python/uv, its own build context is the repo root
  # (see ai-service/Dockerfile for why), own Postgres+pgvector, alembic
  # migrate-on-boot. polls_client.py's POLLS_SERVICE_HOST had the same
  # hardcoded-127.0.0.1 issue api-gateway's modules had — parameterized via
  # pydantic-settings the same way, default unchanged for native runs.
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres-ai:5432/ai_service_db
      POLLS_SERVICE_HOST: polls
    ports:
      - "3004:3004"
    volumes:
      - ./ai-service:/repo/ai-service
      - ai-service-venv:/repo/ai-service/.venv
    depends_on:
      postgres-ai:
        condition: service_healthy
      polls:
        condition: service_started
    networks:
      - voting-system

  # Step 8: frontend — NEXT_PUBLIC_API_GATEWAY_URL stays localhost:3000
  # (unchanged), since it's read in the browser, which is outside the
  # Docker network and only ever talks to the gateway's host-mapped port.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    networks:
      - voting-system
