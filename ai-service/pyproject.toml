[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nikola Uzunov", email = "109785756+Nikolla2000@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "google-genai>=2.29.0",
    "grpcio>=1.84.0",
    "grpclib>=0.4.9",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.1.4",
    "voyageai>=0.5.0",
]

[project.scripts]
ai-service = "ai_service.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
]
