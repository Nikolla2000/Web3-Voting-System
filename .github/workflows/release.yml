name: Release

# Pushing a v* tag (git tag v1.0.0 && git push origin v1.0.0) creates a
# GitHub Release with notes generated from the merged pull requests. The same
# tag makes docker.yml publish the images under that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          notes=$(cat <<EOF
          Run this release's images with:

          \`\`\`
          IMAGE_TAG=$version docker compose -f docker-compose.prod.yml up
          \`\`\`

          Images: \`ghcr.io/$owner/web3-voting-<service>:$version\`
          EOF
          )
          args=("$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$notes")
          # v1.0.0-rc.1 and the like.
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
