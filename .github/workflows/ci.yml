name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      contracts: ${{ steps.filter.outputs.contracts }}
      frontend-e2e: ${{ steps.filter.outputs.frontend-e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'
            ai-service:
              - *workflow
              - 'ai-service/**'
              # gRPC stubs are generated from these at build time.
              - 'backend/libs/shared/src/ai/**/*.proto'
              - 'backend/libs/shared/src/polls/**/*.proto'
            contracts:
              - *workflow
              - 'contracts/**'
            frontend-e2e:
              - *workflow
              - 'frontend/**'
              # The vote test checks its proof against the backend's own encoding.
              - 'backend/libs/shared/src/blockchain/identifier.util.ts'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma clients
        run: |
          for app in identity polls blockchain; do
            (cd "apps/$app" && npx prisma generate)
          done
      # Also enforces Prettier, via eslint-plugin-prettier. Runs after
      # generation because the type-aware rules need the Prisma client types.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx jest --ci

  # The slower suites below run on pull requests (and manual runs) only, so
  # pushes to development keep fast feedback.

  backend-docker:
    name: Backend integration & e2e
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma clients
        run: |
          for app in identity polls blockchain; do
            (cd "apps/$app" && npx prisma generate)
          done
      # Both suites start their own containers through testcontainers (Redis;
      # Postgres plus a real identity process) and pass every setting
      # explicitly, so no .env or secrets are needed.
      - name: Integration tests
        run: npm run test:integration -- --ci
      - name: E2E tests
        run: npm run test:e2e -- --ci

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  frontend-e2e:
    name: Frontend e2e
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.frontend-e2e == 'true')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # e2e/support/test.ts serves Semaphore's circuit files from this folder,
      # downloading them only on a miss.
      - name: Cache Semaphore circuit files
        uses: actions/cache@v4
        with:
          path: frontend/e2e/.cache/snark-artifacts
          key: snark-artifacts-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: snark-artifacts-
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  ai-service:
    name: AI service
    needs: changes
    if: needs.changes.outputs.ai-service == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate gRPC stubs
        run: uv run python scripts/gen_proto.py
      - name: Unit tests
        run: uv run pytest

  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Compile
        run: npx hardhat compile
      - name: Tests
        run: npx hardhat test

  # The one check to mark as required in branch protection: path-filtered
  # jobs report "skipped" when their project is untouched, which a required
  # check would otherwise wait on forever.
  ci-result:
    name: CI result
    needs: [changes, backend, backend-docker, frontend, frontend-e2e, ai-service, contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any project job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All changed projects passed."
