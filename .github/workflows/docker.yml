name: Docker images

# Publishes a production image per service to GHCR. main only moves through
# pull requests that passed CI (branch protection), so nothing is retested
# here. Pull requests that touch the Docker setup build without pushing.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '**/Dockerfile.prod'
      - '**/.dockerignore'
      - 'backend/docker-entrypoint.prod.sh'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, context: backend, file: backend/Dockerfile.prod, app: api-gateway }
          - { name: identity, context: backend, file: backend/Dockerfile.prod, app: identity }
          - { name: polls, context: backend, file: backend/Dockerfile.prod, app: polls }
          - { name: blockchain, context: backend, file: backend/Dockerfile.prod, app: blockchain }
          - { name: notifications, context: backend, file: backend/Dockerfile.prod, app: notifications }
          - { name: ai-service, context: ., file: ai-service/Dockerfile.prod }
          - { name: frontend, context: frontend, file: frontend/Dockerfile.prod }
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; the account name isn't.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/web3-voting-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
